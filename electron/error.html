<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C.A.W.L. — Error</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0d12;
    color: #c0a98b;
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }
  .center { text-align: center; max-width: 480px; padding: 40px; }
  .icon {
    font-size: 48px;
    margin-bottom: 20px;
    color: #8a1d17;
  }
  h1 {
    font-family: Georgia, serif;
    font-size: 20px;
    letter-spacing: 4px;
    color: #c1342a;
    margin-bottom: 12px;
  }
  .msg {
    font-family: monospace;
    font-size: 12px;
    color: #94a0ae;
    line-height: 1.8;
    margin-bottom: 24px;
  }
  .btn {
    font-family: monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: #c0a98b;
    background: transparent;
    border: 1px solid #2a3340;
    border-radius: 2px;
    padding: 10px 20px;
    cursor: pointer;
    margin: 0 6px;
    transition: border-color 0.15s;
  }
  .btn:hover { border-color: #8a1d17; }
  .btn.primary {
    background: linear-gradient(180deg, #8a1d17, #2e0a07);
    border-color: #8a1d17;
    color: #e8ddc8;
  }
</style>
</head>
<body>
  <div class="center">
    <div class="icon">&#x2620;</div>
    <h1>COGITATOR FAILURE</h1>
    <div class="msg">
      The machine-spirit could not establish a connection to the server.<br>
      Possible causes: server not running, port 8123 occupied, or missing dependencies.<br><br>
      Try running: <strong>cawl doctor</strong> in PowerShell for diagnostics.
    </div>
    <button class="btn primary" onclick="window.cawl?.restartServer()">RETRY</button>
    <button class="btn" onclick="window.close()">SHUTDOWN</button>
  </div>
  <script>
    const btn = document.querySelector('.btn.primary');
    if (btn) btn.addEventListener('click', async () => {
      if (window.cawl) {
        btn.textContent = 'RESTARTING...';
        const result = await window.cawl.restartServer();
        if (result.ok) location.reload();
        else btn.textContent = 'RETRY FAILED';
      }
    });
  </script>
</body>
</html>
