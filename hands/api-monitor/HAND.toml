[hand]
name = "api-monitor"
version = "0.1.0"
description = "Monitors experimental APIs with free rate limits. Checks availability, latency, and updates reports."
schedule = "0 */4 * * *"  # Every 4 hours

[hand.tools]
allowed = ["websearch", "webfetch", "filesystem"]
denied = ["shell", "browser"]

[hand.guardrails]
read_only = true
require_approval = false
max_tokens_per_run = 20000
timeout_seconds = 120

[hand.output]
directory = "hands/reports/api-status"
format = "markdown"
retain_days = 7

[hand.dashboard]
metrics = ["apis_checked", "apis_available", "latency_avg", "errors"]

[hand.model]
primary = "Steel/phi3:mini"
fallback = "Groq/qwen/qwen3.6-27b"

[hand.report]
filename = "api-status-latest.md"
rotate_count = 5
delete_after_write = true
