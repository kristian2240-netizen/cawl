<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C.A.W.L. — Notion Avatar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e0e0e0;
      gap: 2rem;
    }
    h1 {
      font-size: 1.2rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #C9A84C;
    }
    .avatar-container {
      width: 320px;
      height: 320px;
      border-radius: 50%;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 0 60px rgba(30, 144, 255, 0.15), 0 0 120px rgba(139, 26, 26, 0.1);
    }
    .avatar-container svg {
      width: 100%;
      height: 100%;
    }
    .sizes {
      display: flex;
      gap: 1.5rem;
      align-items: flex-end;
    }
    .size-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }
    .size-item span {
      font-size: 0.7rem;
      opacity: 0.5;
    }
    .size-item div {
      background: #fff;
      border-radius: 50%;
      overflow: hidden;
    }
    .size-item div svg { width: 100%; height: 100%; }
    .s128 { width: 128px; height: 128px; }
    .s64 { width: 64px; height: 64px; }
    .s32 { width: 32px; height: 32px; }
    .s16 { width: 16px; height: 16px; }
  </style>
</head>
<body>
  <h1>Belisarius Cawl — Notion Avatar</h1>

  <div class="avatar-container">
    <object data="/static/cawl-avatar.svg" type="image/svg+xml" width="100%" height="100%">
      <img src="/static/cawl-avatar.svg" alt="Cawl Avatar">
    </object>
  </div>

  <div class="sizes">
    <div class="size-item">
      <div class="s128"><object data="/static/cawl-avatar.svg" type="image/svg+xml"></object></div>
      <span>128px</span>
    </div>
    <div class="size-item">
      <div class="s64"><object data="/static/cawl-avatar.svg" type="image/svg+xml"></object></div>
      <span>64px</span>
    </div>
    <div class="size-item">
      <div class="s32"><object data="/static/cawl-avatar.svg" type="image/svg+xml"></object></div>
      <span>32px</span>
    </div>
    <div class="size-item">
      <div class="s16"><object data="/static/cawl-avatar.svg" type="image/svg+xml"></object></div>
      <span>16px</span>
    </div>
  </div>
</body>
</html>
